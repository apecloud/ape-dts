[package]
name = "dt-main"
version = "2.0.26"
edition = "2021"

[lints]
workspace = true

[features]
metrics = ["dt-task/metrics"]
tracing = ["dep:console-subscriber", "dep:dt-common", "dep:tonic", "dep:tonic-prost", "dep:tracing-subscriber", "dt-common/tracing", "tokio/tracing"]

[dependencies]
dt-task = {path = "../dt-task", version = "0.1.0"}
dt-precheck = {path = "../dt-precheck", version = "0.1.0"}
dt-common = {path = "../dt-common", version = "0.1.0", optional = true}
clap = { workspace = true }
console-subscriber = { version = "=0.5.0", optional = true }
tokio = { workspace = true }
tonic = { version = "=0.14.5", optional = true }
tonic-prost = { version = "=0.14.5", optional = true }
tracing-subscriber = { workspace = true, optional = true }
