      MONGO_INITDB_ROOT_PASSWORD: 123456
      MONGO_RS_HOST: mongo-src
      MONGO_RS_NAME: rs0
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongo/mongo-keyfile:/run/secrets/mongo-keyfile:ro
      - ./docker/mongo/start-mongo-rs.sh:/usr/local/bin/start-mongo-rs.sh:ro
    entrypoint:
      - bash
      - /usr/local/bin/start-mongo-rs.sh
    healthcheck:
      test:
        - CMD-SHELL
        - 'if command -v mongosh >/dev/null 2>&1; then mongosh "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin" --quiet --eval "quit(db.adminCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)"; else mongo admin -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --quiet --eval "quit(db.adminCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)"; fi'
