services:
  mysql-tls-src: &mysql-tls
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: test_db
    ports: ["13307:3306"]
    entrypoint: ["bash", "/usr/local/bin/start-mysql-server-tls.sh"]
    volumes:
      - ./docker/tls:/tls:ro
      - ./docker/mysql/start-mysql-server-tls.sh:/usr/local/bin/start-mysql-server-tls.sh:ro
      - ./docker/mysql/20-create-mysql-test-users-tls.sql:/docker-entrypoint-initdb.d/20-create-test-users-tls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p123456 -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  mysql-tls-dst:
    <<: *mysql-tls
    ports: ["13308:3306"]

  # The binlog client cannot send a client certificate; use a matching SSL-only pair.
  mysql-tls-cdc-src: &mysql-tls-cdc
    <<: *mysql-tls
    ports: ["13309:3306"]
    volumes:
      - ./docker/tls:/tls:ro
      - ./docker/mysql/start-mysql-server-tls.sh:/usr/local/bin/start-mysql-server-tls.sh:ro
      - ./docker/mysql/20-create-mysql-cdc-user-tls.sql:/docker-entrypoint-initdb.d/20-create-test-users-tls.sql:ro

  mysql-tls-cdc-dst:
    <<: *mysql-tls-cdc
    ports: ["13310:3306"]

  postgres-tls-src: &postgres-tls
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["15433:5432"]
    entrypoint: ["bash", "/usr/local/bin/start-postgresql-server-tls.sh"]
    volumes:
      - ./docker/tls:/tls:ro
      - ./docker/postgres/start-postgresql-server-tls.sh:/usr/local/bin/start-postgresql-server-tls.sh:ro
      - ./docker/postgres/pg_hba-tls.conf:/etc/postgresql/pg_hba-tls.conf:ro
      - ./docker/postgres/20-create-postgresql-test-user-tls.sql:/docker-entrypoint-initdb.d/20-create-test-users-tls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  postgres-tls-dst:
    <<: *postgres-tls
    ports: ["15434:5432"]

  mssql-tls-src: &mssql-tls
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "ApeDts_mssql_2022!"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["11433:1433"]
    volumes:
      - ./docker/tls:/tls:ro
      - ./docker/mssql/mssql-tls.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  mssql-tls-dst:
    <<: *mssql-tls
    ports: ["11434:1433"]

  mysql-src:
    image: mysql:8.0
    container_name: mysql-src-it
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    command:
      - mysqld
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-slave-updates=ON
      - --character-set-server=utf8mb3
      - --collation-server=utf8mb3_general_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p123456
      timeout: 5s
      retries: 5
      start_period: 20s
      interval: 5s

  mysql-dst:
    image: mysql:8.0
    container_name: mysql-dst-it
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test_db
