# Purpose: select the test server identity and allow client-initiated TLS without
# forcing encryption, so the same server also supports ssl_mode=disable tests.
# Loaded on every mssql-tls-{src,dst} start from /var/opt/mssql/mssql.conf.
# SQL Server 2022 loads TLS settings from mssql.conf, not startup arguments.
[network]
tlscert = /tls/server/server.crt
tlskey = /tls/server/server.key
tlsprotocols = 1.2
forceencryption = 0
