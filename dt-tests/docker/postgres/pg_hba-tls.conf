# Purpose: require a client certificate for remote ape_dts connections while
# retaining password authentication for other test users and plaintext-mode tests.
# Loaded by postgres-tls-{src,dst} at startup via the hba_file command-line option.
local all all trust
hostssl all ape_dts all scram-sha-256 clientcert=verify-full
host all ape_dts all reject
host all all all scram-sha-256
