[extractor]
db_type=mysql
extract_type=snapshot
url={case_sensitive_mysql_extractor_url}

[sinker]
db_type=mysql
sink_type=check
url={case_sensitive_mysql_sinker_url}

[checker]
batch_size=2

[filter]
do_tbs=TEST_db_1.*
do_events=insert

[parallelizer]
parallel_type=rdb_merge
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1
