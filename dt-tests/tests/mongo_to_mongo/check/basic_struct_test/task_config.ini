[extractor]
db_type=mongo
extract_type=struct
url={mongo_extractor_url}
username={mongo_extractor_username}
password={mongo_extractor_password}

[sinker]
db_type=mongo
sink_type=check
url={mongo_sinker_url}
username={mongo_sinker_username}
password={mongo_sinker_password}

[filter]
do_tbs=mongo_struct_check_src.*
do_structures=collection,index

[router]
db_map=mongo_struct_check_src:mongo_struct_check_dst
tb_map=mongo_struct_check_src.orders:mongo_struct_check_dst.routed_orders,mongo_struct_check_shadow.orders:mongo_struct_check_dst.routed_orders,mongo_struct_check_src.missing_empty:mongo_struct_check_absent.missing_empty

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=8

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
