[extractor]
db_type=mongo
extract_type=snapshot
url={mongo_extractor_url}
app_name=APE_DTS

[sinker]
db_type=mongo
sink_type=check
url={mongo_sinker_without_auth_url}
username={mongo_sinker_username}
password={mongo_sinker_password}

[checker]
recheck_interval_secs=5
recheck_count=4
batch_size=10

[filter]
do_dbs=sample_db
ignore_dbs=
do_tbs=sample_db.sample_tb
ignore_tbs=
do_events=insert

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=mongo
parallel_size=1

[pipeline]
buffer_size=2
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
