[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
batch_size=5
max_connections=4

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=5
max_connections=4

[filter]
do_dbs=big_packet_test
do_tbs=big_packet_test.large_values
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=10
checkpoint_interval_secs=1
batch_sink_interval_secs=5

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
