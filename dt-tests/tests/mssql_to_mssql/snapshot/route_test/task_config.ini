[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
batch_size=2
max_connections=4

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=4

[filter]
do_dbs=route_src_schema,route_table_schema,route_col_schema
do_tbs=route_src_schema.*,route_table_schema.*,route_col_schema.*
ignore_cols=json:[{"db":"route_src_schema","tb":"schema_orders","ignore_cols":["ignored_value"]}]
do_events=insert

[router]
db_map=route_src_schema:route_dst_schema
tb_map=route_table_schema.source_orders:route_table_dst.target_orders,route_col_schema.source_users:route_col_dst.target_users
col_map=json:[{"db":"route_col_schema","tb":"source_users","col_map":{"id":"user_id","value":"display_name"}}]

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=8
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
