[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=4
batch_size=2
max_connections=8

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=6

[filter]
do_dbs=
do_tbs=ape_dts.route_src_schema.*,ape_dts.route_table_schema.*,ape_dts.route_col_schema.*,route_src_db.dbo.database_orders,[route.source.*].[schema.with.*].[database orders.*]
ignore_cols=json:[{"db":"ape_dts","tb":"route_src_schema.schema_orders","ignore_cols":["ignored_value"]}]
do_events=insert

[router]
db_map=route_src_db:route_dst_db,[route.source.*]:[route.target.*]
tb_map=ape_dts.route_src_schema.schema_orders:ape_dts.route_dst_schema.schema_orders,ape_dts.route_src_schema.schema_payloads:ape_dts.route_dst_schema.schema_payloads,ape_dts.route_table_schema.source_orders:ape_dts.route_table_dst.target_orders,ape_dts.route_table_schema.source_metrics:ape_dts.route_table_dst.target_metrics,ape_dts.route_col_schema.source_users:ape_dts.route_col_dst.target_users,ape_dts.route_col_schema.source_events:ape_dts.route_col_dst.target_events
col_map=json:[{"db":"ape_dts","tb":"route_col_schema.source_users","col_map":{"id":"user_id","value":"display_name","external_code":"public_id","payload":"raw_payload"}},{"db":"ape_dts","tb":"route_col_schema.source_events","col_map":{"event_id":"target_event_id","event_name":"target_event_name","event_time":"target_event_time","event_amount":"target_event_amount"}}]

[parallelizer]
parallel_type=snapshot
parallel_size=4

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
