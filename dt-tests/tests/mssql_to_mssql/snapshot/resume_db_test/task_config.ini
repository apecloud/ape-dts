[global]
task_id=mssql_resume_db_test

[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
batch_size=2
max_connections=4

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=4

[filter]
do_dbs=resume_test
do_tbs=resume_test.*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=8
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[resumer]
resume_type=from_target
table_full_name=ape_dts_resume_test.positions
max_connections=2
