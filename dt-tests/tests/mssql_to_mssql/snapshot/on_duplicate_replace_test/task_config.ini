[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
batch_size=4
max_connections=4

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=4
max_connections=4
replace=true

[filter]
do_dbs=on_duplicate_replace
do_tbs=on_duplicate_replace.*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=8
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
