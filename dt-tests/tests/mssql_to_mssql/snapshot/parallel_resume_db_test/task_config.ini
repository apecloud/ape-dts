[global]
task_id=mssql_parallel_resume_db_test

[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=chunk
parallel_size=4
partition_cols=json:[{"db":"parallel_resume_db","tb":"nullable_rows","partition_col":"split_key"}]
batch_size=3
max_connections=10

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=3
max_connections=8

[filter]
do_dbs=parallel_resume_db
do_tbs=parallel_resume_db.*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=24
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[resumer]
resume_type=from_target
table_full_name=ape_dts_parallel_resume.positions
max_connections=3
