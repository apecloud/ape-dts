[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=2
batch_size=2
max_connections=4

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=4

[filter]
do_dbs=order_key_src
do_events=insert
ignore_cols=json:[{"db":"order_key_src","tb":"dbo.cursor_ignored","ignore_cols":["a"]}]

[router]
db_map=order_key_src:order_key_dst

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[mock]
unordered_compare=true
