[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=require
parallel_type=table
parallel_size=4
batch_size=7
max_connections=6

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=require
batch_size=7
max_connections=6

[filter]
do_dbs=ssl_test
do_tbs=ssl_test.*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=4

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
