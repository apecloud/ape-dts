[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=chunk
parallel_size=3
partition_cols=json:[{"db":"parallel_test","tb":"nullable_rows","partition_col":"split_key"}]
batch_size=3
max_connections=6

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=4
max_connections=4

[filter]
do_dbs=parallel_test
do_tbs=parallel_test.*
do_events=insert
where_conditions=json:[{"db":"parallel_test","tb":"where_rows","condition":"id > 5"}]

[parallelizer]
parallel_type=snapshot
parallel_size=3

[pipeline]
buffer_size=12
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
