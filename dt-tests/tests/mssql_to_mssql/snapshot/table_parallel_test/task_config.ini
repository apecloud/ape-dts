[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=3
partition_cols=json:[{"db":"ape_dts","tb":"table_parallel_test.nullable_partition_rows","partition_col":"id"}]
batch_size=7
max_connections=10

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=7
max_connections=8

[filter]
do_dbs=
do_tbs=ape_dts.table_parallel_test.*
do_events=insert
where_conditions=json:[{"db":"ape_dts","tb":"table_parallel_test.where_condition_1","condition":"id > 1"},{"db":"ape_dts","tb":"table_parallel_test.where_condition_2","condition":"id > 1 AND value < 9"}]

[parallelizer]
parallel_type=snapshot
parallel_size=3

[pipeline]
buffer_size=32
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[mock]
unordered_compare=true
unordered_compare_threads=4
