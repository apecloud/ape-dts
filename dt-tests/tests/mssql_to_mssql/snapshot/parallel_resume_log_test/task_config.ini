[global]
task_id=mssql_parallel_resume_log_test

[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=chunk
parallel_size=4
partition_cols=json:[{"db":"ape_dts","tb":"parallel_resume_log.nullable_rows","partition_col":"split_key"}]
batch_size=3
max_connections=10

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=3
max_connections=8

[filter]
do_dbs=
do_tbs=ape_dts.parallel_resume_log.*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=24
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[resumer]
resume_type=from_log
log_dir=./dt-tests/tests/mssql_to_mssql/snapshot/parallel_resume_log_test/resume_logs
config_file=./dt-tests/tests/mssql_to_mssql/snapshot/parallel_resume_log_test/resume.config
