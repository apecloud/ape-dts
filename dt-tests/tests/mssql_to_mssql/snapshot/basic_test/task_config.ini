[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=8
batch_size=7
max_connections=10

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=7
max_connections=8

[filter]
do_dbs=basic_test,[Upper_Case_DB]
do_tbs=basic_test.*,[Upper_Case_DB].*
do_events=insert
ignore_cols=json:[{"db":"basic_test","tb":"ignore_cols_1","ignore_cols":["ignored_value_1","ignored_value_2"]},{"db":"basic_test","tb":"ignore_cols_2","ignore_cols":["ignored_value"]}]
where_conditions=json:[{"db":"basic_test","tb":"where_condition_1","condition":"id > 1"},{"db":"basic_test","tb":"where_condition_2","condition":"id > 1 AND value < 9"}]

[parallelizer]
parallel_type=snapshot
parallel_size=8

[pipeline]
buffer_size=32
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[mock]
unordered_compare=true
unordered_compare_threads=4
