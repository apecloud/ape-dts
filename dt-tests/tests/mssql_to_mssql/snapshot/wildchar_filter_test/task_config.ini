[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=4
batch_size=2
max_connections=8

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=6

[filter]
do_dbs=filter_db_*
ignore_dbs=filter_db_skip
do_tbs=ape_dts.test_db_*.*,ape_dts.other_test_db_1.*,ape_dts.filter_schema_*.*,ape_dts.wildchar_filter.star*,ape_dts.wildchar_filter.question?,ape_dts.wildchar_filter.r#regex_[0-9]+#,ape_dts.wildchar_filter.exact_name,ape_dts.wildchar_filter.plus+name,ape_dts.wildchar_filter.paren(name),ape_dts.wildchar_filter.[bracket[12]]],ape_dts.wildchar_filter.brace{2},ape_dts.wildchar_filter.caret^name,ape_dts.wildchar_filter.dollar$name,ape_dts.wildchar_filter.pipe|name,ape_dts.wildchar_filter.[quoted*name],ape_dts.wildchar_filter.[quoted?name],ape_dts.wildchar_filter.skip*,ape_dts.wildchar_filter.plus+star*
ignore_tbs=ape_dts.test_db_3.*,ape_dts.test_db_4.*,ape_dts.test_db_?.one_pk_no_uk_2,ape_dts.*_test_db_1.one_pk_no_uk_2,ape_dts.filter_schema_skip.*,ape_dts.wildchar_filter.skip_star*,ape_dts.wildchar_filter.skip_question?,ape_dts.wildchar_filter.r#skip_regex_[0-9]+#,ape_dts.wildchar_filter.skip+name
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=4

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
