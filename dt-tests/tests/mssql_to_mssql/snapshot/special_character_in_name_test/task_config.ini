[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=4
batch_size=2
max_connections=8

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=2
max_connections=6

[filter]
do_dbs=[mssql_filter.db_*_e2e],[mssql_filter.ignore&db_e2e]
ignore_dbs=[mssql_filter.ignore&db_e2e]
do_tbs=ape_dts.[*.*_test_db].*,ape_dts.[&.&_test_db].*,ape_dts.[test_db_^.^].[one_pk_no_uk_2_^.^],ape_dts.[test_db_@.@].[one_pk_no_uk_2_@.@],ape_dts.[filter.schema_*].*,ape_dts.[filter.ignore?schema].*
ignore_tbs=ape_dts.[test_db_*.*].*,ape_dts.[test_db_&.&].*,ape_dts.[*.*_test_db].[one_pk_no_uk_1_*.*],ape_dts.[&.&_test_db].[one_pk_no_uk_1_&.&],ape_dts.[filter.ignore?schema].*
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=4

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
