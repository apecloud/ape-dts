[extractor]
db_type=mssql
extract_type=struct
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
db_batch_size=10
max_connections=4

[sinker]
db_type=mssql
sink_type=struct
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
conflict_policy=interrupt
max_connections=4

[filter]
do_dbs=struct_collation_mssql2mssql_1
ignore_dbs=
do_tbs=
ignore_tbs=
do_events=
do_structures=database,table,constraint,comment,index

[router]
db_map=
tb_map=
col_map=

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100
