[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
parallel_type=table
parallel_size=4
partition_cols=json:[{"db":"ape_dts_snapshot_extractor_component_test","tb":"invalid_order_columns.generated_always_order_rows","partition_col":"valid_from"},{"db":"ape_dts_snapshot_extractor_component_test","tb":"invalid_order_columns.rowversion_order_rows","partition_col":"rowversion_value"},{"db":"ape_dts_snapshot_extractor_component_test","tb":"invalid_order_columns.timestamp_order_rows","partition_col":"timestamp_value"},{"db":"ape_dts_snapshot_extractor_component_test","tb":"snapshot_extractor_test.snapshot_rows","partition_col":"split_key"}]
batch_size=10
max_connections=4
connection_timeout_secs=15

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=10
max_connections=4
connection_timeout_secs=15

[filter]
do_dbs=ape_dts_snapshot_extractor_component_test

[parallelizer]
parallel_type=snapshot
parallel_size=4

[pipeline]
buffer_size=32
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
