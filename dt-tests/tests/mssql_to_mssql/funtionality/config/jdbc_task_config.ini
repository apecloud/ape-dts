[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_jdbc_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
app_name=ape-dts-jdbc-test
parallel_type=table
parallel_size=1
batch_size=10
max_connections=1
connection_timeout_secs=15

[sinker]
db_type=mssql
sink_type=write
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
batch_size=10
max_connections=1
connection_timeout_secs=15

[filter]
do_events=insert

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=32
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
