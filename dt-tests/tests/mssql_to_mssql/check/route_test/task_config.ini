[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_extractor_without_auth_url}
username={mssql_extractor_username}
password={mssql_extractor_password}
ssl_mode=disable
batch_size=2
max_connections=4

[sinker]
db_type=mssql
sink_type=check
url={mssql_sinker_without_auth_url}
username={mssql_sinker_username}
password={mssql_sinker_password}
ssl_mode=disable
max_connections=4

[checker]
batch_size=2

[filter]
do_dbs=
ignore_dbs=
do_tbs=ape_dts.dbo.check_route_src
ignore_tbs=
do_events=

[router]
tb_map=ape_dts.dbo.check_route_src:ape_dts.dbo.check_route_dst
col_map=json:[{"db":"ape_dts","tb":"dbo.check_route_src","col_map":{"id":"target_id","val":"target_val"}}]

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100
