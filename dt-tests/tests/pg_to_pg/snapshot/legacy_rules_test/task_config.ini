[extractor]
db_type=pg
extract_type=snapshot
url={pg_extractor_url}

[sinker]
db_type=pg
sink_type=write
url={pg_sinker_url}
batch_size=2

[filter]
do_dbs=legacy_allowed,legacy_shard_*
ignore_dbs=legacy_denied
do_tbs=legacy_denied.rescued,legacy_selected.kept,legacy_allowed.blocked
ignore_tbs=legacy_allowed.blocked
do_events=insert

[router]
db_map=legacy_shard_a:legacy_merged,legacy_shard_b:legacy_merged

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
