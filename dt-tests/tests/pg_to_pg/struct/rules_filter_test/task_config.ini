[extractor]
db_type=pg
extract_type=struct
url={pg_extractor_url}

[sinker]
db_type=pg
sink_type=struct
url={pg_sinker_url}
batch_size=2

[source.schema]
include=rules_struct*
exclude=rules_struct_hidden*

[source.table]
include=rules_struct.ord*,rules_struct.star*,rules_struct_hidden.rescued
exclude=rules_struct.block*,rules_struct.star_skip*

[source.structure]
include=database,table,constraint,index,comment
exclude=index

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
