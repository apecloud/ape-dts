[extractor]
extract_type=struct
db_type=pg
url={pg_extractor_url}

[sinker]
sink_type=struct
db_type=pg
batch_size=1
url={pg_sinker_url}
conflict_policy=interrupt

[filter]
do_dbs=struct_pg_expression
do_structures=database,table,index

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
