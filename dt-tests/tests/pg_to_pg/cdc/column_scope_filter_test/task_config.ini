[extractor]
db_type=pg
extract_type=cdc
url={pg_extractor_url}
slot_name=ape_column_scope_test
recreate_slot_if_exists=true
pub_name=ape_dts_publication_for_all_tables
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[sinker]
db_type=pg
sink_type=write
url={pg_sinker_url}
batch_size=2

[source.column]
include=column_scope.selected.id,column_scope.blocked.id,column_scope.a_empty.id
exclude=column_scope.blocked.*,column_scope.a_empty.id

[filter]
do_events=insert,update,delete

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
