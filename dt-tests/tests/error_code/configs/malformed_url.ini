[extractor]
db_type=mysql
extract_type=snapshot
url=not-a-database-url

[sinker]
db_type=mysql
sink_type=write
url=mysql://127.0.0.1:1/test

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=1
checkpoint_interval_secs=1

[runtime]
log_level=error
log4rs_file=./log4rs.yaml
log_dir=/tmp/ape-dts-error-code-test/malformed-url

[global]
task_id=error-code-malformed-url
