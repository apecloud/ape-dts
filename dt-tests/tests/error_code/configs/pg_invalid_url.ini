[extractor]
db_type=pg
extract_type=snapshot
url=postgres://127.0.0.1/test?sslmode=invalid

[sinker]
db_type=pg
sink_type=write
url=postgres://127.0.0.1/test?sslmode=invalid

[filter]
do_dbs=error_code_test

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=1
checkpoint_interval_secs=1

[runtime]
log_level=error
log4rs_file=./log4rs.yaml
log_dir=/tmp/ape-dts-error-code-test/pg

[global]
task_id=error-code-pg
