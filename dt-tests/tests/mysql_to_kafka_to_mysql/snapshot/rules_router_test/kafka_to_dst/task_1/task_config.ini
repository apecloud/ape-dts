[extractor]
db_type=kafka
extract_type=cdc
url={kafka_extractor_url}
group=ape_rules_test
topic=rules.mysql.snapshot.router.default
partition=0
offset=0
ack_interval_secs=1

[sinker]
db_type=mysql
sink_type=write
url={mysql_sinker_url}
batch_size=2

[source.table]
include=*.*
[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
