[extractor]
db_type=redis
extract_type=snapshot
url={redis_extractor_without_auth_url}
username={redis_extractor_username}
password={redis_extractor_password}

[sinker]
db_type=redis
sink_type=check
url={redis_sinker_without_auth_url}
username={redis_sinker_username}
password={redis_sinker_password}

ttl_tolerance_ms=25

[checker]
batch_size=2
recheck_count=1
recheck_interval_secs=1
recheck_queue_size=2
recheck_queue_memory_mb=1

[filter]
do_dbs=*

[parallelizer]
parallel_type=redis
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log_dir=./logs
log4rs_file=./log4rs.yaml
