[extractor]
db_type=redis
extract_type=snapshot
url={redis_cluster_extractor_url}
is_cluster=true

[sinker]
db_type=redis
sink_type=check
url={redis_cluster_sinker_url}
is_cluster=true

ttl_tolerance_ms=25

[checker]
batch_size=2
recheck_queue_size=2
recheck_queue_memory_mb=1

[filter]
do_dbs=*

[parallelizer]
parallel_type=redis
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log_dir=./logs
log4rs_file=./log4rs.yaml
