[extractor]
db_type=redis
extract_type=snapshot_and_cdc
repl_port=10008
url={redis_tls_extractor_url_7_0_verify_ca}
ssl_mode=verify_ca
ssl_ca_path=./docker/tls/server/server-ca.crt
is_cluster=false

[filter]
do_dbs=*
do_events=
ignore_dbs=
ignore_tbs=
do_tbs=

[sinker]
db_type=redis
sink_type=write
method=restore
url={redis_tls_sinker_url_7_0_verify_ca}
ssl_mode=verify_ca
ssl_ca_path=./docker/tls/server/server-ca.crt
batch_size=2
is_cluster=false

[router]
db_map=
col_map=
tb_map=

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[parallelizer]
parallel_type=redis
parallel_size=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
