[extractor]
db_type=redis
extract_type=snapshot_and_cdc
repl_port=10008
url={redis_tls_extractor_url_6_2}
ssl_mode=require
is_cluster=true

[filter]
do_dbs=*
do_events=
ignore_dbs=
ignore_tbs=
do_tbs=

[sinker]
db_type=redis
sink_type=write
method=restore
url={redis_tls_sinker_url_6_2}
ssl_mode=require
batch_size=2
is_cluster=true

[router]
db_map=
col_map=
tb_map=

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[parallelizer]
parallel_type=redis
parallel_size=3

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/redis_cluster_6_2/snapshot_and_cdc
