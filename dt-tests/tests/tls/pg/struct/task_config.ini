[extractor]
db_type=pg
extract_type=struct
url={pg_tls_extractor_url}
ssl_mode=require
ssl_ca_path={pg_extractor_ssl_ca_path}
ssl_client_cert_path={pg_extractor_ssl_client_cert_path}
ssl_client_key_path={pg_extractor_ssl_client_key_path}

[sinker]
db_type=pg
sink_type=struct
url={pg_tls_sinker_url}
ssl_mode=require
ssl_ca_path={pg_sinker_ssl_ca_path}
ssl_client_cert_path={pg_sinker_ssl_client_cert_path}
ssl_client_key_path={pg_sinker_ssl_client_key_path}
conflict_policy=interrupt

[filter]
do_dbs=tls_test
do_events=

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/pg/struct
