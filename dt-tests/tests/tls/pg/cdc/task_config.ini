[extractor]
db_type=pg
extract_type=cdc
url={pg_tls_extractor_url}
ssl_mode=require
ssl_ca_path={pg_extractor_ssl_ca_path}
ssl_client_cert_path={pg_extractor_ssl_client_cert_path}
ssl_client_key_path={pg_extractor_ssl_client_key_path}
slot_name=tls_test
recreate_slot_if_exists=true
heartbeat_interval_secs=1
heartbeat_tb=tls_heartbeat.ape_dts_heartbeat

[sinker]
db_type=pg
sink_type=write
url={pg_tls_sinker_url}
ssl_mode=require
ssl_ca_path={pg_sinker_ssl_ca_path}
ssl_client_cert_path={pg_sinker_ssl_client_cert_path}
ssl_client_key_path={pg_sinker_ssl_client_key_path}

[filter]
do_tbs=tls_test.accounts
do_events=insert,update,delete

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/pg/cdc
