[extractor]
db_type=mongo
extract_type=snapshot
url={mongo_tls_sharding_extractor_url}
username=
password=
ssl_mode=require
ssl_ca_path={mongo_extractor_ssl_ca_path}
ssl_client_cert_path={mongo_extractor_ssl_client_cert_path}
batch_size=2

[sinker]
db_type=mongo
sink_type=write
url={mongo_tls_sharding_sinker_url}
username=
password=
ssl_mode=require
ssl_ca_path={mongo_sinker_ssl_ca_path}
ssl_client_cert_path={mongo_sinker_ssl_client_cert_path}
batch_size=2

[filter]
do_dbs=
ignore_dbs=
do_tbs=mongo_tls_sharding_snapshot.*
ignore_tbs=
do_events=insert

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/mongo_shard/snapshot
