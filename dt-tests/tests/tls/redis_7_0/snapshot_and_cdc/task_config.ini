[extractor]
db_type=redis
extract_type=snapshot_and_cdc
repl_port=10008
url={redis_tls_extractor_url_7_0}
ssl_mode=require
ssl_ca_path={redis_extractor_ssl_ca_path}
ssl_client_cert_path={redis_extractor_ssl_client_cert_path}
ssl_client_key_path={redis_extractor_ssl_client_key_path}
is_cluster=false

[filter]
do_dbs=*
do_events=
ignore_dbs=
ignore_tbs=
do_tbs=

[sinker]
db_type=redis
sink_type=write
method=restore
url={redis_tls_sinker_url_7_0}
ssl_mode=require
ssl_ca_path={redis_sinker_ssl_ca_path}
ssl_client_cert_path={redis_sinker_ssl_client_cert_path}
ssl_client_key_path={redis_sinker_ssl_client_key_path}
batch_size=2
is_cluster=false

[router]
db_map=
col_map=
tb_map=

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[parallelizer]
parallel_type=redis
parallel_size=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/redis_7_0/snapshot_and_cdc
