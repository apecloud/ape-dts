[extractor]
db_type=mssql
extract_type=snapshot
url={mssql_tls_extractor_url}
ssl_mode=require
ssl_ca_path={mssql_extractor_ssl_ca_path}

[sinker]
db_type=mssql
sink_type=write
url={mssql_tls_sinker_url}
ssl_mode=require
ssl_ca_path={mssql_sinker_ssl_ca_path}

[filter]
do_tbs=ape_dts.tls_test.accounts
do_events=insert,update,delete

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/mssql/snapshot
