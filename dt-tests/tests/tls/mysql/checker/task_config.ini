[extractor]
db_type=mysql
extract_type=snapshot
url={mysql_tls_extractor_url}
ssl_mode=require
ssl_ca_path={mysql_extractor_ssl_ca_path}
ssl_client_cert_path={mysql_extractor_ssl_client_cert_path}
ssl_client_key_path={mysql_extractor_ssl_client_key_path}

[sinker]
db_type=mysql
sink_type=check
url={mysql_tls_sinker_url}
ssl_mode=require
ssl_ca_path={mysql_sinker_ssl_ca_path}
ssl_client_cert_path={mysql_sinker_ssl_client_cert_path}
ssl_client_key_path={mysql_sinker_ssl_client_key_path}

[filter]
do_tbs=tls_test.accounts
do_events=insert,update,delete

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=16
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/mysql/checker
