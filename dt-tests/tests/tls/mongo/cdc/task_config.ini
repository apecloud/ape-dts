[extractor]
db_type=mongo
extract_type=cdc
url={mongo_tls_extractor_url}
username=root
password=123456
ssl_mode=require
ssl_ca_path={mongo_extractor_ssl_ca_path}
source=op_log

[filter]
do_dbs=mongo_tls_cdc
ignore_dbs=
do_tbs=
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=mongo
sink_type=write
url={mongo_tls_sinker_url}
username=root
password=123456
ssl_mode=require
ssl_ca_path={mongo_sinker_ssl_ca_path}
batch_size=2

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=mongo
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs/tls/mongo/cdc
