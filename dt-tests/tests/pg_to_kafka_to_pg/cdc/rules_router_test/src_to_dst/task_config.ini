[extractor]
db_type=pg
extract_type=cdc
url={pg_extractor_url}
ddl_meta_tb=public.ape_dts_ddl_command
start_lsn=
slot_name=ape_rules_test
recreate_slot_if_exists=true
pub_name=ape_dts_publication_for_all_tables
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[sinker]
db_type=pg
sink_type=write
url={pg_sinker_url}
batch_size=2

[rules.schema]
do=rules_inventory,rules_archive,rules_plain
route=rules_inventory:rules_archive,rules_archive:rules_final

[rules.table]
route=rules_inventory.orders:rules_special.renamed,"rules_inventory"."order,log:1":"rules_special"."renamed,log:2","rules_inventory"."literal*":rules_special.star_renamed

[rules.column]
route=rules_inventory.orders.id:rules_special.renamed.order_id,rules_inventory.orders.note:rules_special.renamed.label

[rules.event]
do=*

[router]
db_map=rules_inventory:legacy_wrong

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml

[rules.ddl]
do=create_table,alter_table,rename_table
