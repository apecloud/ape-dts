[extractor]
db_type=mysql
extract_type=cdc
url={mysql_extractor_url}
binlog_position=0
binlog_filename=
server_id=2000
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[sinker]
db_type=mysql
sink_type=write
url={mysql_sinker_url}
batch_size=2

[rules.db]
do=rules_inventory,rules_scope_*
ignore=rules_denied,rules_scope_hidden*
where_conditions=rules_inventory:"id > 999"

[rules.table]
do=rules_pattern.order?,rules_pattern.r#regex[0-9]+#,`rules_pattern`.`literal*`,`rules_pattern`.`order,log:1`,rules_denied.rescued,rules_pattern.star*,rules_pattern.*tail,rules_pattern.mid*end,rules_pattern.*token*,rules_whole.*,rules_scope_hidden.rescued,rules_tenant_*.orders,*.rules_shared,`rules_pattern`.`literal?`,`rules_pattern`.`r#literal#`,`rules_pattern`.`quote``name`
ignore=rules_inventory.blocked,rules_pattern.order2,rules_pattern.star_block*,rules_whole.skip*

[rules.column]
do=rules_inventory.orders.id,rules_inventory.orders.note*,rules_inventory.orders.secret*
ignore=*.*.secret*

[rules.event]
do=insert,delete
ignore=delete

[rules.collection]
do=unused.*

[filter]
do_dbs=legacy_only
do_events=delete

[rules.ddl]
do=create_table,alter_table,truncate_table
ignore=truncate_table

[rules.dcl]
do=create_user,grant,drop_user
ignore=drop_user

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
