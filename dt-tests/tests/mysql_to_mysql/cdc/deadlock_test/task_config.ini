[extractor]
db_type=mysql
extract_type=cdc
url={mysql_extractor_url}
server_id=2000
binlog_position=0
binlog_filename=
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[filter]
do_tbs=cdc_deadlock.accounts
do_events=insert,update,delete

[sinker]
db_type=mysql
sink_type=write
url={mysql_sinker_url}
max_connections=8
batch_size=256
replace=true
; transaction_isolation=repeatable_read

[parallelizer]
parallel_type=rdb_merge
parallel_size=8

[pipeline]
buffer_size=4096
batch_sink_interval_secs=1
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
