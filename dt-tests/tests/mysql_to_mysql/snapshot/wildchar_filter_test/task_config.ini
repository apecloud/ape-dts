[extractor]
db_type=mysql
extract_type=snapshot
url={mysql_extractor_url}

[sinker]
db_type=mysql
sink_type=write
url={mysql_sinker_url}
batch_size=2

[filter]
do_dbs=test_db_*
ignore_dbs=test_db_3
do_tbs=other_test_db_1.*,wildchar_filter.star*,wildchar_filter.question?,wildchar_filter.r#regex_[0-9]+#,wildchar_filter.exact_name,wildchar_filter.plus+name,wildchar_filter.paren(name),wildchar_filter.bracket[12],wildchar_filter.brace{2},wildchar_filter.caret^name,wildchar_filter.dollar$name,wildchar_filter.pipe|name,wildchar_filter.`quoted*name`,wildchar_filter.`quoted?name`,wildchar_filter.skip*,wildchar_filter.plus+star*
ignore_tbs=test_db_4.*,test_db_?.one_pk_no_uk_2,*_test_db_1.one_pk_no_uk_2,wildchar_filter.skip_star*,wildchar_filter.skip_question?,wildchar_filter.r#skip_regex_[0-9]+#,wildchar_filter.skip+name
do_events=insert

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
