[extractor]
db_type=mysql
extract_type=struct
url={mysql_extractor_url}

[sinker]
db_type=mysql
sink_type=struct
url={mysql_sinker_url}
batch_size=2

[rules.db]
do=rules_struct
route=rules_struct:rules_struct_dst

[rules.table]
route=rules_struct.orders:rules_struct_dst.renamed

[rules.structure]
do=database,table,constraint,index,comment

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
