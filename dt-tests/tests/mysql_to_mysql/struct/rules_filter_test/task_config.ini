[extractor]
db_type=mysql
extract_type=struct
url={mysql_extractor_url}

[sinker]
db_type=mysql
sink_type=struct
url={mysql_sinker_url}
batch_size=2

[rules.db]
do=rules_struct*
ignore=rules_struct_hidden*

[rules.table]
do=rules_struct.ord*,rules_struct.star*,rules_struct_hidden.rescued
ignore=rules_struct.block*,rules_struct.star_skip*

[rules.structure]
do=database,table,constraint,index,comment
ignore=index

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
