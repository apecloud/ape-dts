[extractor]
db_type=mysql
extract_type=struct
url={mysql_extractor_url}

[sinker]
db_type=mysql
sink_type=struct
url={mysql_sinker_url}
batch_size=2

[source.db]
include=rules_struct*
exclude=rules_struct_hidden*

[source.table]
qinclude=rules_struct.ord*,rules_struct.audit,rules_struct.star*,rules_struct_hidden.rescued
exclude=rules_struct.block*,rules_struct.star_skip*

[filter]
do_structures=database,table,constraint,comment

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=64
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
